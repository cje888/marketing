<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CEVYQ Digital Cards</title>
<meta name="description" content="Digital business cards and landing pages, designed and built for you. Calls, WhatsApp, LINE, socials and save contact in one link.">
<meta property="og:title" content="Your whole business in one link">
<meta property="og:description" content="Digital business cards and landing pages, designed and built for you by CEVYQ Group.">
<meta name="theme-color" content="#2a2e35">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: one phone-first column of 3D blocks, same family as the cards it sells */
  :root{
    color-scheme:dark;
    --bg:#2a2e35; --block:#3a3f48; --block2:#454a53; --tile:#2a2e35; --line:rgba(255,255,255,.1);
    --ink:#f4f1ea; --muted:#a9afbd; --orange:#f5862a; --orange2:#ffb067; --gold:#e6c27a; --gold2:#f7e2b0; --teal:#4fd1c5;
    --serif:"Instrument Serif",Georgia,serif;
    --sans:Inter,"Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html:lang(th) body{--sans:"Noto Sans Thai",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.65}
  body{min-height:100vh;background:#373c44;color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
       padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
       display:flex;justify-content:center}
  main{width:100%;max-width:480px;display:flex;flex-direction:column;gap:22px}

  /* top bar */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:.86rem;text-decoration:none;color:var(--ink)}
  .brand img{width:34px;height:34px;border-radius:10px;background:#fff;padding:3px}
  .brand span{color:var(--gold)}
  .lang{display:flex;padding:4px;border-radius:999px;background:var(--tile);border:1px solid var(--line);box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
  .lang button{font:700 .8rem/1 var(--sans);border:0;border-radius:999px;padding:8px 13px;background:transparent;color:var(--muted);cursor:pointer}
  .lang button[aria-pressed=true]{background:linear-gradient(145deg,var(--gold2),var(--gold));color:#2b1f08;box-shadow:0 3px 0 #8a6420}
  .lang button:focus-visible,.btn:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}

  /* blocks with the rainbow ring and 3D edge, like the cards */
  .block{position:relative;border-radius:26px;border:3px solid transparent;
    background:linear-gradient(160deg,var(--block2),var(--block)) padding-box,conic-gradient(from 210deg,var(--gold),var(--teal),#8b7bff,var(--orange),var(--gold)) border-box;
    box-shadow:0 0 0 1px rgba(255,255,255,.25),0 8px 0 #1c1f24,0 26px 44px rgba(10,12,16,.5),inset 0 1px 0 rgba(255,255,255,.14)}
  .pad{padding:22px 20px}
  h2{font:700 .74rem/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:#cfd3d9;margin:2px 6px 12px}
  html:lang(th) h2{letter-spacing:.04em;font-size:.86rem}
  .h3{font-family:var(--serif);font-weight:400;font-size:1.9rem;line-height:1.1;text-wrap:balance}
  html:lang(th) .h3{font-family:var(--sans);font-weight:700;font-size:1.45rem;line-height:1.35}
  .h3 em{color:var(--orange);font-style:italic}
  html:lang(th) .h3 em{font-style:normal}
  .sub{color:var(--muted);margin-top:8px}

  /* hero */
  .hero{overflow:hidden;text-align:center;padding:26px 20px 0}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font:700 .72rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);
           border:1px solid rgba(230,194,122,.4);background:rgba(0,0,0,.18);border-radius:999px;padding:8px 12px}
  html:lang(th) .eyebrow{letter-spacing:.02em;font-size:.8rem}
  .eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(79,209,197,.2)}
  h1{font-family:var(--serif);font-weight:400;font-size:3rem;line-height:1.02;margin:16px 0 10px;text-wrap:balance}
  h1 em{color:var(--orange)}
  html:lang(th) h1{font-family:var(--sans);font-weight:700;font-size:2.05rem;line-height:1.3}
  html:lang(th) h1 em{font-style:normal}
  .lead{color:var(--muted);max-width:34ch;margin:0 auto;text-wrap:balance}
  .ctas{display:grid;gap:10px;margin:20px 0 26px}
  .heroPhone{width:min(250px,68%);margin:0 auto;transform:translateY(8px)}

  /* phone frame */
  .phone{position:relative;border-radius:34px;padding:9px;background:linear-gradient(160deg,#5b616b,#1b1e23);box-shadow:0 0 0 1px rgba(255,255,255,.25),0 22px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3)}
  .phone .scr{aspect-ratio:1/2;border-radius:26px;overflow:hidden;background:#111 top/cover no-repeat}
  .phone::before{content:"";position:absolute;top:16px;left:50%;transform:translateX(-50%);width:62px;height:16px;border-radius:99px;background:#0d0f12;z-index:2}

  /* buttons */
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font:700 1rem/1.2 var(--sans);padding:16px;border-radius:18px;border:0;cursor:pointer;text-decoration:none;transition:transform .15s}
  .btn:active{transform:translateY(4px)}
  .btn.wa{color:#062b14;background:linear-gradient(145deg,#5cf08f,#18a34a);box-shadow:0 7px 0 #0d6b2f,0 16px 26px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.5)}
  .btn.gold{color:#2b1f08;background:linear-gradient(100deg,var(--gold2),var(--gold));box-shadow:0 7px 0 #8a6420,0 16px 26px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.6)}
  .btn.ghost{color:var(--ink);background:var(--tile);border:1px solid var(--line);box-shadow:0 5px 0 #1c1f24}
  .btn.sm{padding:11px 10px;font-size:.88rem;border-radius:14px}

  /* problem tiles */
  .probs{display:grid;gap:10px;margin-top:16px}
  .prob{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:var(--tile);border:1px solid rgba(0,0,0,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .prob b{font-weight:600}
  .x{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#ff6b6b,#d63a3a);box-shadow:0 5px 0 -1px #7d1717;color:#fff;font-weight:800}
  .fix{margin-top:14px;padding:14px;border-radius:18px;background:linear-gradient(135deg,rgba(79,209,197,.18),rgba(245,134,42,.14));border:1px solid rgba(79,209,197,.35);font-weight:600}

  /* samples */
  .samples{padding:18px 0 20px}
  .rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 18px 8px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .smp{flex:0 0 82%;scroll-snap-align:center;border-radius:22px;background:var(--tile);border:1px solid rgba(0,0,0,.35);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .smp .phone{width:72%;margin:0 auto}
  .smp .tag{align-self:flex-start;font:700 .68rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#062b2a;background:var(--teal);border-radius:999px;padding:6px 10px}
  html:lang(th) .smp .tag{letter-spacing:.02em;font-size:.76rem}
  .smp h3{font-size:1.15rem;line-height:1.25}
  .smp p{color:var(--muted);font-size:.92rem}
  .smp .url{font:600 .82rem/1 var(--sans);color:var(--gold2)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
  .qrbox{display:none;background:#fff;border-radius:16px;padding:12px;text-align:center}
  .qrbox img{width:150px;max-width:100%;image-rendering:pixelated;display:block;margin:0 auto}
  .qrbox small{display:block;color:#333;font-size:.78rem;margin-top:6px}
  .smp.showqr .qrbox{display:block}
  .smp.showqr .phone{display:none}
  .navrow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
  .arw{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--tile);color:var(--ink);font-size:1.5rem;line-height:1;cursor:pointer;box-shadow:0 4px 0 #1c1f24;display:grid;place-items:center;padding-bottom:3px}
  .arw:active{transform:translateY(3px);box-shadow:0 1px 0 #1c1f24}
  .dots{display:flex;gap:6px}
  .dots i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.2);transition:.25s;cursor:pointer}
  .dots i.on{width:20px;background:var(--gold)}

  /* features */
  .feats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .feat{padding:14px 12px;border-radius:18px;background:var(--tile);border:1px solid rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);min-width:0}
  .feat b{font-size:.95rem;line-height:1.3}
  .feat:last-child:nth-child(odd){grid-column:1/-1}
  .feat span{color:var(--muted);font-size:.82rem;line-height:1.4}
  .ico3d{position:relative;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;background:var(--c);flex:none;
    box-shadow:0 8px 0 -1px var(--d),0 14px 20px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.45),inset 0 -6px 12px rgba(0,0,0,.2);transform:translateY(-3px)}
  .ico3d::after{content:"";position:absolute;left:10%;right:10%;top:6%;height:42%;border-radius:14px 14px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));pointer-events:none;z-index:1}
  .ico3d svg{position:relative;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
  .ico3d img{width:100%;height:100%;border-radius:inherit;display:block;object-fit:cover}
  .ico3d.pic{background:transparent}
  .ico3d.pic img{position:relative;z-index:0}
  .ico3d.wht{background:#fff}
  .ico3d.wht img{object-fit:contain;padding:5px}
  .c1{--c:linear-gradient(145deg,#5cf08f,#18a34a);--d:#0d6b2f}.c2{--c:linear-gradient(145deg,#f7e2b0,#c99a45);--d:#8a6420;color:#3a2a0b}
  .c3{--c:linear-gradient(45deg,#f9b93b,#f2552c 35%,#d6247c 65%,#7a35d4);--d:#5a1c8f}.c4{--c:linear-gradient(145deg,#ffb067,#f5862a);--d:#93450a}
  .c5{--c:linear-gradient(145deg,#6be3d8,#1f9f94);--d:#0e5c55}.c6{--c:linear-gradient(145deg,#a99bff,#6a52e8);--d:#3a2a96}

  /* who chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chips span{font-weight:600;font-size:.88rem;padding:9px 13px;border-radius:999px;background:var(--tile);border:1px solid var(--line);box-shadow:0 3px 0 #1c1f24}

  /* steps */
  .steps{display:grid;gap:10px;margin-top:16px;counter-reset:s}
  .step{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:18px;background:var(--tile);border:1px solid rgba(0,0,0,.35)}
  .step::before{counter-increment:s;content:counter(s);flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#2b1f08;
    background:linear-gradient(145deg,var(--gold2),var(--gold));box-shadow:0 5px 0 -1px #8a6420}
  .step b{display:block}
  .step span{color:var(--muted);font-size:.9rem}

  /* faq */
  details{border-radius:16px;background:var(--tile);border:1px solid rgba(0,0,0,.35);margin-top:10px}
  summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:600;display:flex;justify-content:space-between;gap:12px}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";color:var(--gold);font-size:1.3rem;line-height:1}
  details[open] summary::after{content:"–"}
  details p{padding:0 16px 16px;color:var(--muted);font-size:.93rem}

  /* contact */
  .contact{text-align:center}
  .icons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
  .soc{display:flex;justify-content:center;padding:14px 0;border-radius:18px;background:var(--tile);border:1px solid rgba(0,0,0,.35);text-decoration:none}
  .soc .ico3d{width:54px;height:54px;border-radius:17px}
  .soc:active .ico3d{transform:translateY(2px)}
  .myqr{display:flex;align-items:center;gap:14px;text-align:left;margin-top:16px;padding:12px;border-radius:18px;background:var(--tile);border:1px solid rgba(0,0,0,.35)}
  .myqr img{width:92px;height:92px;border-radius:10px;background:#fff;padding:6px;image-rendering:pixelated;flex:none}
  .myqr span{color:var(--muted);font-size:.88rem}
  .myqr b{color:var(--ink);display:block;margin-bottom:2px}

  footer{text-align:center;color:#c9cdd3;font-size:.78rem}
  footer a{color:inherit}

  .in{opacity:0;transform:translateY(14px);animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.in{animation:none;opacity:1;transform:none}}
</style>
<script src="https://cevyq-stats.chris-e41.workers.dev/t.js" data-card="marketing" data-name="CEVYQ marketing page" defer></script>
</head>

/* ---------- build samples, features, chips, faq ---------- */
const rail = document.getElementById("rail"), dots = document.getElementById("dots");
SAMPLES.forEach(s => {
  const c = document.createElement("article"); c.className = "smp";
  c.innerHTML =
    '<span class="tag" data-t="'+s.key+'_tag"></span>'+
    '<div class="phone"><div class="scr" style="background-image:url('+s.shot+')"></div></div>'+
    '<div class="qrbox"><img src="'+s.qr+'" alt="QR code"><small data-t="scan"></small></div>'+
    '<div><h3 data-t="'+s.key+'_t"></h3><p data-t="'+s.key+'_d"></p></div>'+
    '<span class="url">'+s.url.replace("https://","")+'</span>'+
    '<div class="two"><a class="btn gold sm" href="'+s.url+'" target="_blank" rel="noopener" data-t="open"></a><button class="btn ghost sm qrt" type="button" data-t="qr"></button></div>';
  c.querySelector(".qrt").addEventListener("click", e => {
    c.classList.toggle("showqr");
    e.currentTarget.dataset.t = c.classList.contains("showqr") ? "hide" : "qr";
    e.currentTarget.textContent = T[lang][e.currentTarget.dataset.t];
  });
  rail.appendChild(c); dots.appendChild(document.createElement("i"));
});
const cardW = () => rail.firstElementChild.getBoundingClientRect().width + 14;
function mark(){ const i = Math.round(rail.scrollLeft / cardW()); [...dots.children].forEach((d,j) => d.classList.toggle("on", j === i)); }
rail.addEventListener("scroll", () => requestAnimationFrame(mark));
document.getElementById("prev").onclick = () => rail.scrollBy({left:-cardW(), behavior:"smooth"});
document.getElementById("next").onclick = () => rail.scrollBy({left: cardW(), behavior:"smooth"});
[...dots.children].forEach((d,i) => d.onclick = () => rail.scrollTo({left:i*cardW(), behavior:"smooth"}));

const feats = document.getElementById("feats");
FEATS.forEach(f => { const d = document.createElement("div"); d.className = "feat";
  d.innerHTML = (f.img ? '<span class="ico3d pic'+(f.white?' wht':'')+'" style="--d:'+f.d+'"><img src="'+f.img+'" alt=""></span>' : '<span class="ico3d '+f.c+'">'+SVG(f.i)+'</span>')+'<b data-t="'+f.k+'"></b><span data-t="'+f.k+'d"></span>'; feats.appendChild(d); });

/* ---------- language ---------- */
let lang = "en";
function setLang(l){
  lang = l; document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(el => { const v = T[l][el.dataset.t]; if (v !== undefined) el.innerHTML = v; });
  document.getElementById("chips").innerHTML = T[l].chips.map(c => "<span>"+c+"</span>").join("");
  document.getElementById("faq").innerHTML = T[l].faq.map(q => "<details><summary>"+q[0]+"</summary><p>"+q[1]+"</p></details>").join("");
  const wa = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(T[l].waMsg);
  ["waHero","waEnd","icWa"].forEach(id => document.getElementById(id).href = wa);
  document.getElementById("icMail").href = "mailto:" + EMAIL + "?subject=" + encodeURIComponent(T[l].mailSub);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  document.title = l === "th" ? "CEVYQ นามบัตรดิจิทัล" : "CEVYQ Digital Cards";
  try { localStorage.setItem("lang", l); } catch(e) {}
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  setLang(b.dataset.l);
  try { history.replaceState(null, "", b.dataset.l === "th" ? "#th" : location.pathname); } catch(e) {}
}));
let start = (navigator.language || "").toLowerCase().startsWith("th") ? "th" : "en";
try { start = localStorage.getItem("lang") || start; } catch(e) {}
if (location.hash === "#th") start = "th";
if (location.hash === "#en") start = "en";
setLang(start);
mark();
</script>
